name: CrossFitCoach
options:
  bundleIdPrefix: com.pnotny
targets:
  CrossFitCoach:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CrossFitCoach
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: CrossFit Coach
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - crossfitcoach
            CFBundleURLName: com.pnotny.crossfitcoach
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pnotny.crossfitcoach
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
